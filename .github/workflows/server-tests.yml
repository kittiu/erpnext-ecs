name: Server tests (staged)

# STAGED — deliberately not automatic yet.
#
# It runs only from the Actions tab ("Run workflow") until the app has server-side code worth
# testing. When the first DocType / whitelisted API / hook lands, uncomment the `push` and
# `pull_request` triggers below so it runs whenever Python changes.
#
# What it proves: that erpnext_ecs still installs on a clean bench with erpnext + hrms (the
# dependency, hooks and migration path), and that its tests pass. The fast CI workflow
# (ci.yml) only covers the frontend.

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ['**.py', 'pyproject.toml']
  # pull_request:
  #   paths: ['**.py', 'pyproject.toml']

concurrency:
  group: server-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-test:
    name: Install on a throwaway bench and run the app tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: 'root'
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check for valid Python & merge conflicts
        run: |
          python -m compileall -f "${GITHUB_WORKSPACE}/erpnext_ecs"
          if grep -lr --exclude-dir=node_modules --exclude-dir=.git "^<<<<<<< " "${GITHUB_WORKSPACE}"
          then echo "Found merge conflicts"
          exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Add test_site to hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install bench, erpnext, hrms and this app
        run: bash "${GITHUB_WORKSPACE}/.github/helper/install.sh"

      - name: Run the app tests
        run: cd ~/frappe-bench && bench --site test_site run-tests --app erpnext_ecs
